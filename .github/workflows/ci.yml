name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # pnpm version comes from package.json's packageManager field;
      # specifying it here too makes pnpm/action-setup fail hard.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The client consumes crosswalk data exclusively from
      # @shantanusinghesq/crosswalk (via the client/src/data/crosswalk.ts adapter).
      # Fail if a duplicate data copy reappears under client/src/lib — that
      # dual-copy drift is how the shipped app diverged from the tested data.
      - name: Guard single data source
        run: |
          if grep -rE "export const (CROSSWALK|OWASP_ASI|NIST_800_53|AI_RMF|NIST_CONTROL_DESCRIPTIONS|NIST_AI_RMF_DESCRIPTIONS)" client/src/lib/ 2>/dev/null; then
            echo "::error::Crosswalk data constants found under client/src/lib — import from @shantanusinghesq/crosswalk instead."
            exit 1
          fi

      # Each package.json "license" field must match its adjacent LICENSE file
      # (scanners read the field, not the file). Guards the AGPL-app / MIT-data split.
      - name: Guard license metadata
        run: node scripts/check-license.mjs

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
