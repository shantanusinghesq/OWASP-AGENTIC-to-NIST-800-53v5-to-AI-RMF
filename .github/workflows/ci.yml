name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from package.json's packageManager field;
      # specifying it here too makes pnpm/action-setup@v4 fail hard.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The client consumes crosswalk data exclusively from
      # @haremantra/crosswalk (via the client/src/data/crosswalk.ts adapter).
      # Fail if a duplicate data copy reappears under client/src/lib — that
      # dual-copy drift is how the shipped app diverged from the tested data.
      - name: Guard single data source
        run: |
          if grep -rE "export const (CROSSWALK|OWASP_ASI|NIST_800_53|AI_RMF|NIST_CONTROL_DESCRIPTIONS|NIST_AI_RMF_DESCRIPTIONS)" client/src/lib/ 2>/dev/null; then
            echo "::error::Crosswalk data constants found under client/src/lib — import from @haremantra/crosswalk instead."
            exit 1
          fi

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
