name: Publish @haremantra/crosswalk

on:
  push:
    tags: ['crosswalk-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's packageManager field;
      # specifying it here too makes pnpm/action-setup@v4 fail hard.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@obviate'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @haremantra/crosswalk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
