name: Publish @haremantra/crosswalk

on:
  push:
    tags: ['crosswalk-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # pnpm version comes from package.json's packageManager field;
      # specifying it here too makes pnpm/action-setup fail hard.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@haremantra'
          cache: pnpm
      # The pushed tag (crosswalk-vX.Y.Z) must match the package version, or a
      # mis-tagged push would publish stale contents unchallenged (--no-git-checks
      # disables pnpm's own guard).
      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="$(node -p "require('./packages/crosswalk/package.json').version")"
          EXPECTED="crosswalk-v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version (expected ${EXPECTED})."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Gate publication on the data integrity suite — never publish data
      # that fails referential-integrity checks.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @haremantra/crosswalk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
